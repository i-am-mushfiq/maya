<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="t">
  <title id="t">History explanation, before and after. You ask: why was Julius Caesar killed? A typical AI answer is a list of dates that never says why. MAYA starts with the why: senators believed he was making himself a king. Then a cause-and-effect chain: he wins a civil war against Pompey, is named dictator for life, senators lose their power, and he is stabbed on 15 March 44 BC.</title>
  <style>text{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}</style>

  <rect width="1200" height="660" rx="32" fill="#FFF7EC"/>

  <!-- user message -->
  <rect x="300" y="34" width="600" height="72" rx="36" fill="#1F1B3A"/>
  <text x="600" y="79" font-size="24" font-weight="700" fill="#FFF7EC" text-anchor="middle">"Why was Julius Caesar killed?"</text>

  <!-- LEFT: typical answer -->
  <rect x="40" y="136" width="545" height="494" rx="26" fill="#EDEAF5"/>
  <text x="72" y="184" font-size="26" font-weight="900" fill="#8A84A3">TYPICAL AI ANSWER</text>
  <rect x="72" y="206" width="481" height="306" rx="18" fill="#ffffff" stroke="#C9C4DB" stroke-width="2"/>
  <text x="96" y="242" font-size="19" font-weight="800" fill="#4A4566">Julius Caesar was born in 100 BC</text>
  <text x="96" y="266" font-size="19" font-weight="800" fill="#4A4566">into an old patrician family...</text>
  <g fill="#D8D4E6">
    <rect x="96" y="282" width="430" height="10" rx="5"/>
    <rect x="96" y="300" width="380" height="10" rx="5"/>
  </g>
  <text x="96" y="336" font-size="19" font-weight="800" fill="#4A4566">In 60 BC he formed the First</text>
  <text x="96" y="360" font-size="19" font-weight="800" fill="#4A4566">Triumvirate. From 58 to 50 BC...</text>
  <g fill="#D8D4E6">
    <rect x="96" y="376" width="420" height="10" rx="5"/>
    <rect x="96" y="394" width="350" height="10" rx="5"/>
  </g>
  <text x="96" y="430" font-size="19" font-weight="800" fill="#4A4566">In 49 BC he crossed the Rubicon...</text>
  <text x="96" y="470" font-size="19" font-weight="800" fill="#4A4566">...and in 44 BC he was assassinated.</text>

  <!-- dizzy blob -->
  <circle cx="500" cy="568" r="38" fill="#B9B3CF"/>
  <path d="M480 560 m-7 0 a7 7 0 1 0 7 -7 a4 4 0 1 0 -4 4" stroke="#1F1B3A" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M520 560 m-7 0 a7 7 0 1 0 7 -7 a4 4 0 1 0 -4 4" stroke="#1F1B3A" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M488 586 q6 -6 12 0 t12 0" stroke="#1F1B3A" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="72" y="560" font-size="24" font-weight="900" fill="#1F1B3A">A list of dates.</text>
  <text x="72" y="592" font-size="24" font-weight="900" fill="#1F1B3A">Still no "why".</text>

  <!-- RIGHT: MAYA -->
  <rect x="615" y="136" width="545" height="494" rx="26" fill="#DFF6EF"/>
  <text x="647" y="184" font-size="26" font-weight="900" fill="#1A9E85">WITH MAYA</text>
  <rect x="647" y="206" width="481" height="306" rx="18" fill="#ffffff" stroke="#2EC4A6" stroke-width="3"/>
  <rect x="671" y="226" width="160" height="32" rx="16" fill="#2EC4A6"/>
  <text x="751" y="248" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">THE WHY FIRST</text>
  <text x="671" y="292" font-size="21" font-weight="900" fill="#1F1B3A">Senators believed he was making</text>
  <text x="671" y="318" font-size="21" font-weight="900" fill="#1F1B3A">himself a king.</text>

  <!-- cause chain -->
  <path d="M686 356 V476" stroke="#2EC4A6" stroke-width="4"/>
  <g font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">
    <circle cx="686" cy="356" r="13" fill="#2EC4A6"/><text x="686" y="361">1</text>
    <circle cx="686" cy="396" r="13" fill="#2EC4A6"/><text x="686" y="401">2</text>
    <circle cx="686" cy="436" r="13" fill="#2EC4A6"/><text x="686" y="441">3</text>
    <circle cx="686" cy="476" r="13" fill="#FF6B5B"/><text x="686" y="481">4</text>
  </g>
  <g font-size="19" fill="#1F1B3A">
    <text x="710" y="363">Wins a civil war against Pompey</text>
    <text x="710" y="403">Named dictator for life</text>
    <text x="710" y="443">Senators lose their power</text>
    <text x="710" y="483" font-weight="800">Stabbed on 15 March 44 BC</text>
  </g>

  <!-- happy blob -->
  <circle cx="1075" cy="568" r="38" fill="#2EC4A6"/>
  <ellipse cx="1062" cy="560" rx="6" ry="8" fill="#ffffff"/>
  <ellipse cx="1088" cy="560" rx="6" ry="8" fill="#ffffff"/>
  <circle cx="1063" cy="562" r="3.5" fill="#1F1B3A"/>
  <circle cx="1089" cy="562" r="3.5" fill="#1F1B3A"/>
  <path d="M1063 578 q12 12 24 0" stroke="#1F1B3A" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M1112 528 l10 10 l20 -24" stroke="#1A9E85" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="647" y="560" font-size="24" font-weight="900" fill="#1F1B3A">Cause, then effect.</text>
  <text x="647" y="592" font-size="24" font-weight="900" fill="#1F1B3A">A story you can follow.</text>
</svg>
