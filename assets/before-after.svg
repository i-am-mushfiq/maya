<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="t">
  <title id="t">Technical explanation, before and after. You ask: what is an RNN? A typical AI answer opens with the history of neural networks, lists every variant and buries the answer at the bottom. MAYA answers first: an RNN reads a sequence one item at a time, carrying a running memory called the hidden state. A tiny trace shows the memory fading from 0.46 to 0.35 to 0.27, then the catch: that fading makes long-range links hard to learn.</title>
  <style>text{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}</style>

  <rect width="1200" height="660" rx="32" fill="#FFF7EC"/>

  <!-- user message -->
  <rect x="380" y="34" width="440" height="72" rx="36" fill="#1F1B3A"/>
  <text x="600" y="79" font-size="24" font-weight="700" fill="#FFF7EC" text-anchor="middle">"What is an RNN?"</text>

  <!-- LEFT: typical answer -->
  <rect x="40" y="136" width="545" height="494" rx="26" fill="#EDEAF5"/>
  <text x="72" y="184" font-size="26" font-weight="900" fill="#8A84A3">TYPICAL AI ANSWER</text>
  <rect x="72" y="206" width="481" height="306" rx="18" fill="#ffffff" stroke="#C9C4DB" stroke-width="2"/>
  <text x="96" y="242" font-size="19" font-weight="800" fill="#4A4566">Great question! Neural networks were</text>
  <text x="96" y="266" font-size="19" font-weight="800" fill="#4A4566">first inspired by the human brain...</text>
  <g fill="#D8D4E6">
    <rect x="96" y="282" width="430" height="10" rx="5"/>
    <rect x="96" y="300" width="400" height="10" rx="5"/>
    <rect x="96" y="318" width="350" height="10" rx="5"/>
  </g>
  <text x="96" y="354" font-size="19" font-weight="800" fill="#4A4566">There are many variants: LSTM, GRU,</text>
  <text x="96" y="378" font-size="19" font-weight="800" fill="#4A4566">bidirectional, Elman, Jordan...</text>
  <g fill="#D8D4E6">
    <rect x="96" y="394" width="420" height="10" rx="5"/>
    <rect x="96" y="412" width="380" height="10" rx="5"/>
  </g>
  <text x="96" y="448" font-size="19" font-weight="800" fill="#4A4566">...so basically, it handles sequences.</text>
  <text x="96" y="490" font-size="20" font-weight="900" fill="#FF6B5B">Let me know if you have any questions!</text>

  <!-- dizzy blob -->
  <circle cx="500" cy="568" r="38" fill="#B9B3CF"/>
  <path d="M480 560 m-7 0 a7 7 0 1 0 7 -7 a4 4 0 1 0 -4 4" stroke="#1F1B3A" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M520 560 m-7 0 a7 7 0 1 0 7 -7 a4 4 0 1 0 -4 4" stroke="#1F1B3A" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M488 586 q6 -6 12 0 t12 0" stroke="#1F1B3A" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="72" y="560" font-size="24" font-weight="900" fill="#1F1B3A">The answer is hiding</text>
  <text x="72" y="592" font-size="24" font-weight="900" fill="#1F1B3A">at the bottom.</text>

  <!-- RIGHT: MAYA -->
  <rect x="615" y="136" width="545" height="494" rx="26" fill="#DFF6EF"/>
  <text x="647" y="184" font-size="26" font-weight="900" fill="#1A9E85">WITH MAYA</text>
  <rect x="647" y="206" width="481" height="314" rx="18" fill="#ffffff" stroke="#2EC4A6" stroke-width="3"/>
  <rect x="671" y="226" width="150" height="32" rx="16" fill="#2EC4A6"/>
  <text x="746" y="248" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">ANSWER FIRST</text>
  <text x="671" y="292" font-size="21" font-weight="900" fill="#1F1B3A">An RNN reads a sequence one item</text>
  <text x="671" y="318" font-size="21" font-weight="900" fill="#1F1B3A">at a time, carrying a running memory</text>
  <text x="671" y="344" font-size="21" font-weight="900" fill="#1F1B3A">(the hidden state) from step to step.</text>
  <text x="671" y="382" font-size="18" fill="#4A4566">Memory after a single input of 1:</text>
  <text x="671" y="412" font-size="23" font-weight="900" fill="#1A9E85">0.46 → 0.35 → 0.27</text>
  <text x="900" y="412" font-size="17" font-style="italic" fill="#4A4566">fading each step</text>
  <text x="671" y="450" font-size="19" fill="#1F1B3A"><tspan font-weight="800">The catch:</tspan> that fading makes long-range</text>
  <text x="671" y="475" font-size="19" fill="#1F1B3A">links hard to learn. LSTMs add gates.</text>
  <text x="671" y="505" font-size="17" font-weight="700" fill="#1A9E85">Next: how LSTM gates keep memory alive.</text>

  <!-- happy blob -->
  <circle cx="1075" cy="568" r="38" fill="#2EC4A6"/>
  <ellipse cx="1062" cy="560" rx="6" ry="8" fill="#ffffff"/>
  <ellipse cx="1088" cy="560" rx="6" ry="8" fill="#ffffff"/>
  <circle cx="1063" cy="562" r="3.5" fill="#1F1B3A"/>
  <circle cx="1089" cy="562" r="3.5" fill="#1F1B3A"/>
  <path d="M1063 578 q12 12 24 0" stroke="#1F1B3A" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M1120 548 l8 8 l17 -21" stroke="#1A9E85" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="647" y="560" font-size="24" font-weight="900" fill="#1F1B3A">The answer is</text>
  <text x="647" y="592" font-size="24" font-weight="900" fill="#1F1B3A">the first line.</text>
</svg>
